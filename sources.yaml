# Русскоязычные ленты азербайджанских СМИ.
# Проверено на сервере 23.11.2026 командой `python -m gapp.check_feeds`.
# Источники с `enabled: false` не опрашиваются. Чтобы вернуть источник,
# исправьте адрес ленты и уберите эту строку.
sources:

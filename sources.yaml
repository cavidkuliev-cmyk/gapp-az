# Русскоязычные ленты азербайджанских СМИ.
# Проверено на сервере 23.11.2026 командой `python -m gapp.check_feeds`.
# Источники с `enabled: false` не опрашиваются. Чтобы вернуть источник,
# исправьте адрес ленты и уберите эту строку.
sources:
  - name: Day.az
    site: https://news.day.az
    feeds: [https://news.day.az/rss/all.rss]
  - name: Trend
    site: https://ru.trend.az
    feeds:
      - url: https://ru.trend.az/sitemap_news.php  # карта для новостей: заголовки и даты уже в ней
        type: sitemap
      - https://ru.trend.az/feeds/index.rss        # 23.11.2026 лента отставала на 10 дней
  - name: Report
    site: https://report.az/ru
    feeds: [https://report.az/ru/rss]
  - name: АПА
    site: https://ru.apa.az
    feeds: [https://ru.apa.az/rss]
  - name: АЗЕРТАДЖ
    enabled: false  # robots.txt запрещает бота, нужна договорённость с изданием, проверено 23.11.2026
    site: https://azertag.az/ru
    feeds: [https://azertag.az/ru/rss]
  - name: 1news.az
    site: https://1news.az
    feeds:
      - url: https://1news.az/sitemap.xml  # RSS нет, берём карту сайта
        type: sitemap
  - name: Haqqin.az
    site: https://haqqin.az
    feeds: [https://haqqin.az/rss]
  - name: Minval
    site: https://minval.az
    feeds: [https://minval.az/feed]
  - name: Media.az
    site: https://media.az
    feeds: [https://media.az/rss]
  - name: Oxu.az
    site: https://ru.oxu.az
    feeds: [https://ru.oxu.az/feed]
  - name: Vesti.az
    site: https://vesti.az
    feeds: [https://vesti.az/rss]
  - name: Зеркало
    site: https://zerkalo.az
    feeds: [https://zerkalo.az/feed/]
  - name: Caliber.az
    site: https://caliber.az
    feeds: [https://caliber.az/rss.xml]  # лента Яндекс.Турбо: заголовок берётся из turbo:content
  - name: Baku.ws
    site: https://baku.ws/ru
    feeds: [https://baku.ws/ru/rss]
  - name: Интерфакс-Азербайджан
    enabled: false  # сайт не отвечает, проверено 23.11.2026
    site: https://interfax.az
    feeds: [https://interfax.az/rss]

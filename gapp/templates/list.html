{% extends "base.html" %}
{% block content %}
<main class="cols">
<section class="feed" aria-label="{{ heading }}">
<h1 class="tag gray">{{ heading }}</h1>
{% if site_link %}<p class="muted" style="margin:0 0 8px">{{ L.site_link }}: <a href="{{ site_link }}" rel="noopener" style="color:#1a5fd0">{{ site_link }}</a></p>{% endif %}
{% if query is defined and query | length < 3 %}<p class="muted">{{ L.min_query }}</p>
{% else %}{% include "_rows.html" %}{% endif %}
</section>
</main>
{% endblock %}
